<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960"><title>Classes of the simulated tank</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#39716b" stroke-width="1.5"/></marker></defs><rect width="1600" height="960" fill="#fafbf8"/><text x="50" y="77" font-family="DejaVu Sans" font-size="52" font-weight="700" fill="#163840">Inside the simulated tank</text><text x="52" y="130" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#163840">Model 1 uses four classes to represent a tank, its two pumps and its water sensor.</text><rect x="490" y="190" width="620" height="154" rx="14" fill="#cde7df"/><text x="512" y="230" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#163840">TankSystem</text><text x="512" y="267" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">Coordinates all four parts. Each step updates</text><text x="512" y="297" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">incoming water, outgoing water, then the sensor.</text><path d="M800 344 l-10 12 10 12 10 -12 Z" fill="#39716b"/><path d="M800 368 V432 M280 432 H1320 M280 432 V480 M800 432 V480 M1320 432 V480" stroke="#39716b" stroke-width="3" fill="none"/><text x="826" y="404" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#163840">contains</text><rect x="50" y="480" width="460" height="184" rx="14" fill="#e2edf0"/><text x="72" y="520" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#163840">Pump  × 2</text><text x="72" y="557" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">One fills the tank. One drains it.</text><text x="72" y="587" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">Each calculates the volume moved</text><text x="72" y="617" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">during a step from its on/off state.</text><rect x="570" y="480" width="460" height="184" rx="14" fill="#e2edf0"/><text x="592" y="520" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#163840">WaterTank  × 1</text><text x="592" y="557" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">Stores the current water volume.</text><text x="592" y="587" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">Adds water up to capacity and</text><text x="592" y="617" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">removes what can be drained.</text><rect x="1090" y="480" width="460" height="184" rx="14" fill="#e2edf0"/><text x="1112" y="520" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#163840">WaterLevelSensor  × 1</text><text x="1112" y="557" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">Checks the updated volume.</text><text x="1112" y="587" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">Reports wet at or above its set</text><text x="1112" y="617" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">level, and dry below it.</text><rect x="50" y="709" width="1500" height="115" rx="14" fill="#f2e5c7"/><text x="72" y="749" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#163840">Example   /   Fill until wet (FR03)</text><text x="72" y="786" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">The fill pump moves water in → the tank volume rises → the sensor reports wet → the controller requests pump-off.</text><text x="50" y="877" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#163840">Planned Model 2</text><text x="310" y="877" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">WaterTank stays the same. PrimingRunOnPump extends Pump, and DelayedSensor extends WaterLevelSensor.</text><text x="310" y="915" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">Physical measurements determine which extra pump or sensor effects to include.</text></svg>
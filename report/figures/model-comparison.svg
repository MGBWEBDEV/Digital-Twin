<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960"><title>Model 1 and Model 2 compared</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#39716b" stroke-width="1.5"/></marker></defs><rect width="1600" height="960" fill="#fafbf8"/><text x="48" y="75" font-family="DejaVu Sans" font-size="50" font-weight="700" fill="#163840">One fill task, two tank models</text><text x="50" y="129" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#163840">FR03  /  The same controller starts with a dry sensor and fills until it receives a wet reading.</text><text x="360" y="212" font-family="DejaVu Sans" font-size="36" font-weight="700" fill="#163840">Model 1</text><text x="360" y="250" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#163840">Basic simulation</text><text x="890" y="212" font-family="DejaVu Sans" font-size="36" font-weight="700" fill="#163840">Model 2</text><text x="890" y="250" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#163840">Planned additions, subject to rig measurements</text><rect x="48" y="282" width="282" height="109" rx="12" fill="#ebeeea"/><rect x="342" y="282" width="516" height="109" rx="12" fill="#e3edf3"/><rect x="870" y="282" width="682" height="109" rx="12" fill="#dbece5"/><text x="68" y="345" font-family="DejaVu Sans" font-size="26" font-weight="700" fill="#163840">Start filling</text><text x="363" y="326" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#163840">Water reaches the tank as soon</text><text x="891" y="326" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#163840">Water may first fill the empty intake tube.</text><text x="363" y="360" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#163840">as the intake pump turns on.</text><text x="891" y="360" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#163840">The tank level then starts to rise.</text><rect x="48" y="403" width="282" height="109" rx="12" fill="#ebeeea"/><rect x="342" y="403" width="516" height="109" rx="12" fill="#e3edf3"/><rect x="870" y="403" width="682" height="109" rx="12" fill="#dbece5"/><text x="68" y="466" font-family="DejaVu Sans" font-size="26" font-weight="700" fill="#163840">Sense the level</text><text x="363" y="447" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#163840">The sensor turns wet as soon as</text><text x="891" y="447" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#163840">The sensor may switch at a different level</text><text x="363" y="481" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#163840">water reaches the specified level.</text><text x="891" y="481" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#163840">or take time to respond.</text><rect x="48" y="524" width="282" height="109" rx="12" fill="#ebeeea"/><rect x="342" y="524" width="516" height="109" rx="12" fill="#e3edf3"/><rect x="870" y="524" width="682" height="109" rx="12" fill="#dbece5"/><text x="68" y="587" font-family="DejaVu Sans" font-size="26" font-weight="700" fill="#163840">Exchange signals</text><text x="363" y="568" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#163840">Pump commands and sensor readings</text><text x="891" y="568" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#163840">The simulation may delay a command on its way</text><text x="363" y="602" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#163840">arrive without a communication delay.</text><text x="891" y="602" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#163840">to the pump or a reading on its way back.</text><rect x="48" y="645" width="282" height="109" rx="12" fill="#ebeeea"/><rect x="342" y="645" width="516" height="109" rx="12" fill="#e3edf3"/><rect x="870" y="645" width="682" height="109" rx="12" fill="#dbece5"/><text x="68" y="708" font-family="DejaVu Sans" font-size="26" font-weight="700" fill="#163840">Stop filling</text><text x="363" y="689" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#163840">Water stops entering as soon</text><text x="891" y="689" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#163840">A small amount of water may still enter</text><text x="363" y="723" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#163840">as the intake pump turns off.</text><text x="891" y="723" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#163840">after the intake pump turns off.</text><rect x="48" y="790" width="1504" height="119" rx="14" fill="#f3e8d1"/><text x="70" y="830" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#163840">Shared design</text><text x="70" y="867" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">Both use the same tank-volume rules, drain pump, safety cut-off and test checks. With all extra effects set to zero,</text><text x="70" y="897" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">Model 2 is designed to give the same result as Model 1.</text></svg>
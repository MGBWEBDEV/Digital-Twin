<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960"><title>Tank controller software architecture</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#39716b" stroke-width="1.5"/></marker></defs><rect width="1600" height="960" fill="#fafbf8"/><text x="48" y="67" font-family="DejaVu Sans" font-size="48" font-weight="700" fill="#163840">How the tank controller is tested</text><text x="50" y="113" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#163840">Software architecture   /   Example task FR03: fill until the water reaches the sensor.</text><rect x="50" y="160" width="410" height="117" rx="14" fill="#e2edf0"/><text x="72" y="200" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#163840">Test scenario</text><text x="72" y="237" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">Sets the task and starting conditions.</text><rect x="50" y="355" width="410" height="191" rx="14" fill="#cde7df"/><text x="72" y="395" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#163840">Test runner (harness)</text><text x="72" y="432" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">Reads the clock and tank sensor.</text><text x="72" y="462" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">Calls the controller at each step</text><text x="72" y="492" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">and forwards its pump commands.</text><path d="M255 277 V351" fill="none" stroke="#39716b" stroke-width="3" marker-end="url(#a)"/><rect x="840" y="355" width="700" height="191" rx="14" fill="#e2edf0"/><text x="862" y="395" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#163840">Controller under test</text><text x="862" y="432" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">The same code runs with every tank setup.</text><text x="862" y="462" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">For this task it starts filling when dry and stops</text><text x="862" y="492" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">when the sensor first reports wet.</text><path d="M460 420 H836" fill="none" stroke="#39716b" stroke-width="3" marker-end="url(#a)"/><text x="485" y="403" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">Time + wet/dry reading</text><path d="M840 498 H465" fill="none" stroke="#39716b" stroke-width="3" marker-end="url(#a)"/><text x="485" y="483" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">Fill and drain commands</text><rect x="50" y="601" width="1490" height="76" rx="14" fill="#d7e6ea"/><text x="72" y="641" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#163840">Common tank interface</text><text x="437" y="648" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#163840">The runner reads the sensor and sends pump commands the same way in every setup.</text><path d="M255 546 V597" fill="none" stroke="#39716b" stroke-width="3" marker-end="url(#a)"/><path d="M292 677 V720" fill="none" stroke="#39716b" stroke-width="3" marker-end="url(#a)"/><path d="M1060 677 V720" fill="none" stroke="#39716b" stroke-width="3" marker-end="url(#a)"/><rect x="50" y="724" width="486" height="158" rx="14" fill="#e2edf0"/><text x="72" y="764" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#163840">Real tank adapter</text><text x="72" y="801" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">Talks to the ESP32 over a serial link.</text><text x="72" y="831" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">Firmware reads the sensor, switches</text><text x="72" y="861" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">the pumps and enforces a safety cut-off.</text><rect x="579" y="724" width="961" height="158" rx="14" fill="#e2edf0"/><text x="601" y="764" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#163840">Simulation adapter</text><text x="601" y="801" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">Runs either Model 1 (basic tank) or the planned Model 2</text><text x="601" y="831" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">(adds effects supported by measurements). Both models simulate</text><text x="601" y="861" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">the sensor and pumps and use the same safety cut-off as the rig.</text><rect x="840" y="160" width="700" height="117" rx="14" fill="#f2e5c7"/><text x="862" y="200" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#163840">Independent checker</text><text x="862" y="237" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">Reads the scenario and saved run record to judge each rule.</text><path d="M460 375 H620 V219 H835" fill="none" stroke="#39716b" stroke-width="3" marker-end="url(#a)"/><text x="471" y="312" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#163840">Run record</text><text x="638" y="250" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#163840">Logger saves</text><text x="638" y="275" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#163840">run evidence</text><text x="50" y="931" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#163840">For FR03, the checker uses the recorded pump timing and settled volume. The controller receives only time and wet/dry readings during the run.</text></svg>
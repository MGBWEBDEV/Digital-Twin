<text x="62" y="462" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#edf2f6" font-weight="400" text-anchor="start">Compare each model verdict with the rig verdict. Count missed failures and false alarms.</text>
<text x="40" y="523" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#edf2f6" font-weight="400" text-anchor="start">Tasks: timed fill  •  stop at the wet sensor  •  fill beyond the sensor to a target</text>
<text x="40" y="552" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#edf2f6" font-weight="400" text-anchor="start">Safety applies to every task. A cut-off trip fails FR08. Rig runs require approved safeguards.</text>

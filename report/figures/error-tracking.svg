<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960"><title>What a tank error looks like</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#39716b" stroke-width="1.5"/></marker></defs><rect width="1600" height="960" fill="#fafbf8"/><text x="48" y="58" font-family="DejaVu Sans" font-size="45" font-weight="700" fill="#163840">What a tank error looks like</text><text x="50" y="106" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#163840">Normal fill-until-wet run: sensor dry → fill pump on → sensor wet → fill pump off and stays off.</text><text x="50" y="147" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#163840">Each row is a separate hypothetical run. Numerical limits below are simulation placeholders.</text><text x="55" y="202" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#163840">What goes wrong</text><text x="405" y="202" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#163840">What happens in this example</text><text x="1010" y="202" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#163840">What reveals it</text><rect x="38" y="222" width="1520" height="59" rx="7" fill="#e6efec"/><text x="55" y="260" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#163840">Wrong pump</text><text x="405" y="260" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#163840">A fill is requested, but the drain starts.</text><text x="1010" y="260" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#163840">The drain command reads ON.</text><text x="55" y="322" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#163840">Wrong starting decision</text><text x="405" y="322" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#163840">The sensor is already wet, yet filling starts.</text><text x="1010" y="322" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#163840">First reading wet, then a pump ON command.</text><rect x="38" y="346" width="1520" height="59" rx="7" fill="#e6efec"/><text x="55" y="384" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#163840">Pump restarts</text><text x="405" y="384" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#163840">Filling stops correctly, then starts again.</text><text x="1010" y="384" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#163840">The record shows ON → OFF → ON.</text><text x="55" y="446" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#163840">Wrong fill duration</text><text x="405" y="446" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#163840">A timed fill asks for 10 s. The pump stops at 8 s.</text><text x="1010" y="446" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#163840">The ON interval is 2 s too short.</text><rect x="38" y="470" width="1520" height="59" rx="7" fill="#e6efec"/><text x="55" y="508" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#163840">Late stop</text><text x="405" y="508" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#163840">Sensor first reads wet at 19.0 s. Pump stops at 20 s.</text><text x="1010" y="508" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#163840">The stop deadline was 19.1 s.</text><text x="55" y="570" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#163840">Missed timeout</text><text x="405" y="570" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#163840">The sensor stays dry. Filling continues past 30.1 s.</text><text x="1010" y="570" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#163840">The pump is still ON after the deadline.</text><rect x="38" y="594" width="1520" height="59" rx="7" fill="#e6efec"/><text x="55" y="632" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#163840">Safety cut-off fires</text><text x="405" y="632" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#163840">The pump stays on until the backup timer stops it.</text><text x="1010" y="632" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#163840">A cut-off event is recorded.</text><text x="55" y="694" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#163840">Wrong final level</text><text x="405" y="694" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#163840">The pump stops on time. Water settles at 27 mL.</text><text x="1010" y="694" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#163840">The FR03 example allows 22–26 mL.</text><rect x="38" y="718" width="1520" height="59" rx="7" fill="#e6efec"/><text x="55" y="756" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#163840">Unsafe water level</text><text x="405" y="756" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#163840">Water rises above the safe mark during a run.</text><text x="1010" y="756" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#163840">The simulated peak exceeds the limit.</text><text x="55" y="818" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#163840">Controller error</text><text x="405" y="818" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#163840">The controller crashes or returns an unusable answer.</text><text x="1010" y="818" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#163840">The event log gives the time and error.</text><rect x="38" y="842" width="1520" height="59" rx="7" fill="#e6efec"/><text x="55" y="880" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#163840">Inconsistent replay</text><text x="405" y="880" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#163840">The same inputs produce ON first, then OFF on replay.</text><text x="1010" y="880" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#163840">Its pump command differs on replay.</text><text x="50" y="942" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#163840">A failed check identifies the behaviour to investigate. The two controller defects for the final experiment are still to be selected.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900"><title>Fill until the sensor is wet</title><rect width="1440" height="900" fill="#f9faf7"/><text x="55" y="51" text-anchor="start" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#287468">REQUIREMENT FR03   /   SCENARIO S2</text><text x="55" y="112" text-anchor="start" font-family="DejaVu Sans" font-size="49" font-weight="700" fill="#173944">Fill until the sensor is wet</text><text x="55" y="159" text-anchor="start" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#173944">Worked example using the basic tank model. All numbers are simulation placeholders.</text><rect x="54" y="211" width="765" height="83" rx="14" fill="#dbeae5"/><text x="79" y="245" text-anchor="start" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#173944">Set up the simulated tank</text><text x="79" y="276" text-anchor="start" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#173944">Start with 5 mL. The sensor sits at the 24 mL mark.</text><path d="M421 294 V330" fill="none" stroke="#387268" stroke-width="4"/><path d="M-7 -11 L0 0 L7 -11" transform="translate(421 330) rotate(0)" fill="none" stroke="#387268" stroke-width="4"/><rect x="54" y="332" width="765" height="85" rx="14" fill="#e0eaf3"/><text x="79" y="367" text-anchor="start" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#173944">The controller sees a dry sensor and starts filling.</text><text x="79" y="399" text-anchor="start" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#173944">It receives the time and a wet/dry signal at each check.</text><path d="M421 417 V449" fill="none" stroke="#387268" stroke-width="4"/><path d="M-7 -11 L0 0 L7 -11" transform="translate(421 449) rotate(0)" fill="none" stroke="#387268" stroke-width="4"/><path d="M421 450 L651 523 L421 596 L191 523 Z" fill="#f3dfb2"/><text x="421" y="518" text-anchor="middle" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#173944">Does the sensor</text><text x="421" y="548" text-anchor="middle" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#173944">report wet?</text><path d="M651 523 H781 V447 H552 V490" fill="none" stroke="#387268" stroke-width="4"/><path d="M-7 -11 L0 0 L7 -11" transform="translate(552 490) rotate(0)" fill="none" stroke="#387268" stroke-width="4"/><text x="690" y="506" text-anchor="start" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#173944">Dry</text><text x="680" y="557" text-anchor="start" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#173944">Keep filling*</text><path d="M421 596 V637" fill="none" stroke="#387268" stroke-width="4"/><path d="M-7 -11 L0 0 L7 -11" transform="translate(421 637) rotate(0)" fill="none" stroke="#387268" stroke-width="4"/><text x="443" y="628" text-anchor="start" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#173944">Wet</text><rect x="54" y="640" width="765" height="99" rx="14" fill="#dbeae5"/><text x="80" y="679" text-anchor="start" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#173944">The controller switches the fill pump off.</text><text x="80" y="715" text-anchor="start" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#173944">The test program records the commands and sensor readings.</text><path d="M819 689 H885" fill="none" stroke="#387268" stroke-width="4"/><path d="M-7 -11 L0 0 L7 -11" transform="translate(885 689) rotate(-90)" fill="none" stroke="#387268" stroke-width="4"/><rect x="889" y="211" width="496" height="528" rx="14" fill="#183c49"/><text x="918" y="261" text-anchor="start" font-family="DejaVu Sans" font-size="33" font-weight="700" fill="#ffffff">After the run</text><text x="918" y="310" text-anchor="start" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#ffffff">A separate checker asks</text><text x="918" y="376" text-anchor="start" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#bbebda">Did filling start correctly?</text><text x="918" y="414" text-anchor="start" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#ffffff">One fill period, starting within 0.5 s.</text><text x="918" y="495" text-anchor="start" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#bbebda">Did the pump stop in time?</text><text x="918" y="533" text-anchor="start" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#ffffff">First wet reading expected at 19.0 s.</text><text x="918" y="565" text-anchor="start" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#ffffff">The pump must be off by 19.1 s.</text><text x="918" y="639" text-anchor="start" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#bbebda">Where did the water settle?</text><text x="918" y="677" text-anchor="start" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#ffffff">The final volume must be 22–26 mL.</text><text x="55" y="800" text-anchor="start" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#173944">* If the sensor stays dry, a separate safety rule (FR08) requires the controller to stop filling.</text><text x="55" y="849" text-anchor="start" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#173944">The checker can read the final volume. The controller only sees whether the water has reached the sensor.</text></svg>
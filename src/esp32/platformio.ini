; Rig I/O firmware (WP09a). Board and framework as in StepExample (D32).
; The build stops with an #error until include/rig_config.h is reviewed and
; the cut-off ceiling is set (see README.md). Uploading needs researcher
; approval (AGENTS.md; protocol section 6.1).
;
; Platform pinned for compatibility with the firmware the rig runs now
; (researcher, 2026-11-26): espressif32@6.9.0 = Arduino-ESP32 core 2.0.17,
; the newest platform on the 2.x core that StepExample needs. Unmodified
; StepExample builds with it (checked 2026-11-26). The exact version of the
; rig's current build is unknown. This firmware also builds on
; espressif32@8.0.0 (core 3.3.12). Record the version in the session log.

[env:adafruit_metro_esp32s2]
platform = espressif32@6.9.0
board = adafruit_metro_esp32s2
framework = arduino
monitor_speed = 115200
